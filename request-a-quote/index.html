<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Quote | Sree Aaradhya Clicks</title>
  <link rel="shortcut icon" href="../assets/logo.png" type="image/png">
  <meta name="description" content="Request a personalized quotation for your wedding photography, cinematography, or special event coverage from Sree Aaradhya Clicks.">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Custom Styles for Interactive Quote Form */
    body {
      background-color: #0d0d0d;
      padding-bottom: 120px; /* Space for sticky summary */
    }

    .quote-hero {
      padding: 150px 0 60px;
      text-align: center;
      background: linear-gradient(180deg, var(--black) 0%, var(--dark-bg) 100%);
    }

    .events-nav {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding: 10px 0 20px;
      margin-bottom: 30px;
      scrollbar-width: thin;
      scrollbar-color: var(--purple-brand) var(--gray-900);
    }

    .events-nav::-webkit-scrollbar {
      height: 6px;
    }
    .events-nav::-webkit-scrollbar-track {
      background: var(--gray-900);
      border-radius: 4px;
    }
    .events-nav::-webkit-scrollbar-thumb {
      background: var(--purple-brand);
      border-radius: 4px;
    }

    .event-tab {
      padding: 12px 24px;
      background: var(--dark-card);
      border: 1px solid var(--gray-800);
      border-radius: 30px;
      color: var(--gray-300);
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .event-tab:hover {
      border-color: var(--purple-light);
      color: var(--white);
    }

    .event-tab.active {
      background: var(--gradient-brand);
      color: var(--white-pure);
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(91, 26, 138, 0.4);
    }

    .event-pane {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .event-pane.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-row-custom {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      background: var(--dark-card);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--gray-800);
    }

    .form-group-custom {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group-custom label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--orange-light);
      font-weight: 600;
    }

    .form-group-custom input {
      background: var(--gray-900);
      border: 1px solid var(--gray-700);
      padding: 12px;
      border-radius: 6px;
      color: var(--white);
      font-family: inherit;
    }
    
    .form-group-custom input:focus {
      outline: none;
      border-color: var(--purple-light);
      background: var(--black-light);
    }

    .services-grid-custom {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .service-card {
      background: var(--dark-card);
      border: 1px solid var(--gray-800);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: all 0.3s ease;
    }

    .service-card.selected {
      border-color: var(--purple-light);
      background: rgba(91, 26, 138, 0.1);
    }

    .service-header {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .service-header input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--orange-brand);
      cursor: pointer;
    }

    .service-header h4 {
      margin: 0;
      color: var(--white);
      font-size: 1.1rem;
      font-weight: 600;
    }

    .service-session-badge {
      display: inline-block;
      background: rgba(232, 124, 30, 0.15);
      color: var(--orange-light);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      width: fit-content;
    }

    .service-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .service-card.selected .service-controls {
      opacity: 1;
      pointer-events: auto;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--gray-800);
      border: 1px solid var(--gray-700);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
    }

    .qty-btn.active {
      background: var(--orange-brand);
      border-color: var(--orange-light);
    }

    /* Sticky Summary Bar */
    .sticky-summary {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 1000px;
      background: var(--dark-card);
      border: 1px solid var(--gray-800);
      border-radius: 16px;
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
      z-index: 1000;
    }

    .summary-text h3 {
      color: var(--orange-light);
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .summary-text p {
      color: var(--gray-400);
      font-size: 0.9rem;
      margin: 0;
    }

    .summary-action {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .total-price {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--orange-brand);
    }

    .btn-submit {
      background: #5dc963;
      color: #000;
      padding: 14px 30px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }
    
    .btn-submit:hover {
      background: #4ab550;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .sticky-summary {
        flex-direction: column;
        gap: 15px;
        padding: 15px;
        bottom: 10px;
      }
      .summary-action {
        width: 100%;
        justify-content: space-between;
      }
      .btn-submit {
        padding: 12px 20px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><img src="../assets/logo.png" alt="Sree Aaradhya Clicks Logo"></a>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">Home</a>
        <a href="../about/index.html">About</a>
        <a href="../portfolio/index.html">Portfolio</a>
        <a href="../services/index.html">Services</a>
        <a href="../invitations/index.html">Invitations</a>
        <a href="../request-a-quote/index.html" class="active">Request a Quote</a>
        <a href="../blog/index.html">Blog</a>
        <a href="../contact/index.html">Contact</a>
        <a href="../request-a-quote/index.html" class="nav-cta">Book Now</a>
      </div>
      <div class="nav-toggle" id="navToggle"><span></span><span></span><span></span></div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="quote-hero">
    <div class="container">
      <span class="section-eyebrow">Customize Your Package</span>
      <h1 class="section-title">Request a <span class="gradient-text">Quote</span></h1>
      <p class="section-subtitle">Select your events, add services, and get an instant summary to share with us.</p>
    </div>
  </section>

  <!-- Interactive Form Area -->
  <section class="quote-form-section">
    <div class="container">
      
      <!-- Event Tabs -->
      <div class="events-nav" id="eventsNav">
        <!-- Generated by JS -->
      </div>

      <!-- Event Panes Container -->
      <div id="eventPanes">
        <!-- Generated by JS -->
      </div>

    </div>
  </section>

  <!-- Sticky Summary Bar -->
  <div class="sticky-summary">
    <div class="summary-text">
      <h3>Selection Summary</h3>
      <p id="summaryText">No services selected...</p>
    </div>
    <div class="summary-action">
      <div class="total-price" id="totalPrice">₹ 0</div>
      <button class="btn btn-submit" id="btnSubmit">GET THE QUOTATION</button>
    </div>
  </div>

  <script>
    // Configuration
    const eventsList = [
      "Engagement", "Pre-Wedding", "Vratham", "Mehendi", 
      "Bride Haldi", "Bride Formalities", "Groom Haldi", 
      "Groom Formalities", "Sangeet", "Cocktail Party", 
      "Wedding", "Reception", "Small Reception"
    ];

    const servicesList = [
      { id: 'trad-photo', name: 'Traditional Photography', hasQty: true },
      { id: 'trad-photo-2', name: 'Traditional Photography 2', hasQty: true },
      { id: 'trad-video', name: 'Traditional Videography', hasQty: true },
      { id: 'trad-video-2', name: 'Traditional Videography 2', hasQty: true },
      { id: 'candid-photo', name: 'Candid Photography', hasQty: true },
      { id: 'cinematography', name: 'Cinematography', hasQty: true },
      { id: 'drone', name: 'Drone', hasQty: true },
      { id: 'led-wall', name: 'LED Wall', hasQty: true },
      { id: 'live-stream', name: 'Live Streaming', hasQty: true },
      { id: '360-cam', name: '360 Camera', hasQty: true },
      { id: 'album', name: 'Photography Album', hasQty: false }
    ];

    // State Management
    let appState = {};
    eventsList.forEach(ev => {
      appState[ev] = {
        date: '',
        time: '',
        venue: '',
        services: {}
      };
    });

    // DOM Elements
    const eventsNav = document.getElementById('eventsNav');
    const eventPanes = document.getElementById('eventPanes');
    const summaryText = document.getElementById('summaryText');

    // Initialize UI
    function init() {
      eventsList.forEach((ev, index) => {
        // Create Tab
        const tab = document.createElement('div');
        tab.className = `event-tab ${index === 0 ? 'active' : ''}`;
        tab.textContent = ev;
        tab.onclick = () => switchTab(index);
        eventsNav.appendChild(tab);

        // Create Pane
        const pane = document.createElement('div');
        pane.className = `event-pane ${index === 0 ? 'active' : ''}`;
        pane.id = `pane-${index}`;
        
        let servicesHTML = servicesList.map(srv => `
          <div class="service-card" id="card-${ev}-${srv.id}">
            <label class="service-header">
              <input type="checkbox" onchange="toggleService('${ev}', '${srv.id}', this.checked)">
              <h4>${srv.name}</h4>
            </label>
            ${srv.hasQty ? `<span class="service-session-badge">4-Hour Session</span>` : ''}
            ${srv.hasQty ? `
            <div class="service-controls">
              <button type="button" class="qty-btn active" onclick="setQty('${ev}', '${srv.id}', 1, this)">1</button>
              <button type="button" class="qty-btn" onclick="setQty('${ev}', '${srv.id}', 2, this)">2</button>
            </div>
            ` : ''}
          </div>
        `).join('');

        pane.innerHTML = `
          <div class="form-row-custom">
            <div class="form-group-custom">
              <label>Event Date</label>
              <input type="date" onchange="updateState('${ev}', 'date', this.value)">
            </div>
            <div class="form-group-custom">
              <label>Start Time</label>
              <input type="time" onchange="updateState('${ev}', 'time', this.value)">
            </div>
            <div class="form-group-custom">
              <label>Venue Location</label>
              <input type="text" placeholder="Enter venue..." onchange="updateState('${ev}', 'venue', this.value)">
            </div>
          </div>
          <div class="services-grid-custom">
            ${servicesHTML}
          </div>
        `;
        eventPanes.appendChild(pane);
      });
      
      updateSummary();
    }

    // Interactions
    function switchTab(index) {
      document.querySelectorAll('.event-tab').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      document.querySelectorAll('.event-pane').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
    }

    function updateState(ev, field, value) {
      appState[ev][field] = value;
    }

    function toggleService(ev, srvId, isChecked) {
      const card = document.getElementById(`card-${ev}-${srvId}`);
      if (isChecked) {
        card.classList.add('selected');
        // default to qty 1 if it has qty
        const srvDef = servicesList.find(s => s.id === srvId);
        appState[ev].services[srvId] = srvDef.hasQty ? 1 : true;
      } else {
        card.classList.remove('selected');
        delete appState[ev].services[srvId];
      }
      updateSummary();
    }

    function setQty(ev, srvId, qty, btnElem) {
      // Only do this if the service is checked
      if (!appState[ev].services[srvId]) return;
      
      appState[ev].services[srvId] = qty;
      
      // Update UI for buttons
      const container = btnElem.parentElement;
      container.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
      
      updateSummary();
    }

    function updateSummary() {
      let totalServices = 0;
      let summaryStr = [];

      for (const [ev, data] of Object.entries(appState)) {
        const srvKeys = Object.keys(data.services);
        if (srvKeys.length > 0) {
          totalServices += srvKeys.length;
          summaryStr.push(`${ev} (${srvKeys.length} services)`);
        }
      }

      if (totalServices === 0) {
        summaryText.textContent = "No services selected...";
      } else {
        summaryText.textContent = summaryStr.join(' • ');
      }
    }

    // Submit Logic
    document.getElementById('btnSubmit').addEventListener('click', () => {
      let hasSelections = false;
      let message = `*NEW PRO QUOTATION REQUEST* 📋\n\n`;

      for (const [ev, data] of Object.entries(appState)) {
        const srvKeys = Object.keys(data.services);
        if (srvKeys.length > 0) {
          hasSelections = true;
          message += `*Event:* ${ev}\n`;
          if (data.date) message += `*Date:* ${data.date}\n`;
          if (data.time) message += `*Time:* ${data.time}\n`;
          if (data.venue) message += `*Venue:* ${data.venue}\n`;
          
          message += `*Services:*\n`;
          srvKeys.forEach(srvId => {
            const srvDef = servicesList.find(s => s.id === srvId);
            const val = data.services[srvId];
            if (val === true) {
              message += `- ${srvDef.name}\n`;
            } else {
              message += `- ${srvDef.name} (${val} Session${val > 1 ? 's' : ''})\n`;
            }
          });
          message += `\n`;
        }
      }

      if (!hasSelections) {
        alert("Please select at least one service before getting a quotation.");
        return;
      }

      const phone = '919100689100';
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    });

    // Boot
    init();
  </script>
</body>
</html>
