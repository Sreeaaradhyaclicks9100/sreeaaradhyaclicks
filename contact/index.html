  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><img src="../assets/logo.png" alt="Sree Aaradhya Clicks Logo"></a>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../about/index.html">About</a>
        <a href="../portfolio/index.html">Portfolio</a>
        <a href="../services/index.html">Services</a>
        <a href="../invitations/index.html">Invitations</a>
        <a href="../quotation/index.html">Quotation</a>
        <a href="../blog/index.html">Blog</a>
        <a href="index.html" class="active">Contact</a>
        <a href="../quotation/index.html" class="nav-cta">Get a Quote</a>
      </div>
    </div>
  </nav>

  <header class="section-hero" style="padding: 160px 0 60px; background: var(--black-light); text-align: center;">
    <div class="container">
      <span class="section-eyebrow">Get in Touch</span>
      <h1 class="section-title">Let's Create <span class="gradient-text">Magic</span> Together</h1>
    </div>
  </header>

  <section class="enquiry" style="padding: 80px 0;">
    <div class="container">
      <div class="enquiry-grid">
        <div class="enquiry-info">
          <div class="contact-details">
            <div class="contact-item"><div class="contact-icon"><i class="fas fa-phone-alt"></i></div><div class="contact-item-text"><h4>Phone</h4><p>9100689100</p></div></div>
            <div class="contact-item"><div class="contact-icon"><i class="fas fa-envelope"></i></div><div class="contact-item-text"><h4>Email</h4><p>sac.business@gmail.com</p></div></div>
            <div class="contact-item"><div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div><div class="contact-item-text"><h4>Location</h4><p>Hyderabad, India</p></div></div>
          </div>
        </div>
        <div class="enquiry-form">
          <h3>Enquire Now</h3>
          <form id="enquiryForm">
            <div class="form-group"><label for="name">Name</label><input type="text" id="name" required></div>
            <div class="form-group"><label for="phone">Phone</label><input type="tel" id="phone" required></div>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 <a href="../index.html">Sree Aaradhya Clicks</a>. All Rights Reserved.</p>
      </div>
    </div>
  </footer>
